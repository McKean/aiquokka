name: release

# A pushed tag v* tests, builds and publishes the release: the same test
# job as ci.yml, then one archive per target plus checksums.txt, attached
# to a published release. Run by hand (workflow_dispatch) it is a dry run:
# the same tests and the same build, the archives and checksums kept as
# workflow artifacts, and nothing published.
#
# Every uses: below is pinned by full commit SHA, with the release it is
# as a comment; a tag that moves would run code no review saw.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same steps as ci.yml's test job; keep the two in step.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go-version-file pins the toolchain go.mod names; cache keeps the
      # module and build caches keyed on go.sum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      # The depot's test command: go vet, then go test over every package.
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The linux legs are pure Go (the tray talks dbus), so they
          # cross-compile from ubuntu with cgo off.
          - { goos: linux, goarch: amd64, cgo: "0", runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, cgo: "0", runner: ubuntu-latest }
          # The darwin legs link Cocoa (cmd/tray_prefs_darwin.go,
          # third_party/systray), so they build on macOS with cgo on; the
          # arm64 runner cross-builds amd64 through its universal clang.
          - { goos: darwin, goarch: amd64, cgo: "1", runner: macos-latest }
          - { goos: darwin, goarch: arm64, cgo: "1", runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      # A dry run has no tag to take the version from.
      VERSION: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-dryrun' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build the archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          set -eu
          mkdir -p build dist
          go build -o "build/aiquokka" .
          tar -czf "dist/aiquokka-$VERSION-$GOOS-$GOARCH.tar.gz" -C build aiquokka
      # Only legs whose binary runs on its own runner smoke-test it.
      - name: smoke-test the binary
        if: (matrix.goos == 'linux' && matrix.goarch == 'amd64') || (matrix.goos == 'darwin' && matrix.goarch == 'arm64')
        run: ./build/aiquokka --help >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aiquokka-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  checksums:
    # One job so checksums.txt covers all four archives.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: aiquokka-*
          path: dist
          merge-multiple: true
      - name: write checksums.txt
        run: |
          (cd dist && sha256sum aiquokka-*.tar.gz > checksums.txt && cat checksums.txt)
          set -- dist/aiquokka-*.tar.gz
          test "$#" -eq 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    # Only a tag publishes; a dry run ends with the artifacts above.
    if: github.event_name == 'push'
    needs: [checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job that may write to the release, and it runs no code from
    # the repository: it only hands the built files to GitHub.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # v1.2.3-rc.1 is a pre-release: it never becomes "latest".
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          # A published release is never touched: a re-run after a publish
          # fails here instead of re-uploading.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; not touching it" >&2
            exit 1
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
              --verify-tag --generate-notes --title "$TAG" $prerelease
          fi

name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SemVer tag to publish, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    name: Validate release publisher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test release publisher
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate release tag and checkout
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: python .github/scripts/release.py --validate-checkout "$RELEASE_TAG"

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: windows-2025
            goos: windows
            goarch: amd64
          - runner: windows-2025
            goos: windows
            goarch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test Unix installer
        if: runner.os != 'Windows'
        run: python3 scripts/test_install.py
      - name: Test Windows installer (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_install.ps1
      - name: Test Windows installer (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_install.ps1
      - name: Build archive
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          version="dev-${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF" == refs/tags/* ]]; then
            version="$RELEASE_TAG"
          fi
          python scripts/build-release.py "$version" --os "$TARGET_OS" --arch "$TARGET_ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: aiquokka-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: aiquokka-*
          merge-multiple: true
          path: release
      - name: Verify artifacts and generate checksums
        run: python .github/scripts/release.py --prepare
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py
